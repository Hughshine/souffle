name: artifact-ci

on:
  push:
  pull_request:

jobs:
  build-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bison \
            build-essential \
            cmake \
            flex \
            graphviz \
            libffi-dev \
            libsqlite3-dev \
            mcpp \
            python3 \
            zlib1g-dev

      - name: Configure
        run: cmake -S . -B build

      - name: Build
        run: cmake --build build -j"$(nproc)"

      - name: Regression
        run: ctest --test-dir build -L regression --output-on-failure --progress -j"$(nproc)"
